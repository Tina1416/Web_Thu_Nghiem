<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Thử Nghiệm</title>
    <style>
        /* Thiết lập giao diện tổng thể */
        body {
            background-color: #000000; /* Nền đen */
            color: #ffffff; /* Chữ màu trắng */
            font-family: Arial, sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* Kiểu chữ cho "Web thử nghiệm" */
        h1 {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        /* Kiểu chữ cho "Hạnh Nguyên làm" */
        p {
            font-size: 1.5rem;
            color: #b0b0b0; /* Màu xám nhẹ cho đẹp mắt */
        }
    </style>
</head>
<body>

    <h1>Web thử nghiệm</h1>
    <p>Hạnh Nguyên làm</p>

</body>
</html>
